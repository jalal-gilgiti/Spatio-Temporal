[project]
name = "spatiotemp-ce"
version = "0.1.0"
description = "Experimental learned cardinality estimators for spatio-temporal range queries"
requires-python = ">=3.11"
dependencies = [
    "hydra-core>=1.3.4",
    "matplotlib>=3.11.1",
    "numpy>=2.4.6",
    "omegaconf>=2.3.1",
    "pandas>=3.0.5",
    "psycopg[binary]>=3.3.4",
    "pyarrow>=25.0.1",
    "pyproj>=3.7.2",
    "pyshp>=3.1.6",
    "pytest>=9.1.1",
    "scikit-learn>=1.9.0",
    "scipy>=1.17.1",
    "torch>=2.13.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "integration: requires a live database",
    "slow: long-running test (e.g. trains models across a multi-step sweep)",
]
